name: Cinema CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Verify episode playback in Chromium and WebKit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium webkit
          npm start > /tmp/cinema.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://localhost:8080/api/health
          node tools/test-playback.mjs chromium
          node tools/test-playback.mjs webkit
